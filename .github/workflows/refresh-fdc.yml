name: Refresh FoodData Central catalog

on:
  workflow_dispatch:
    inputs:
      query:
        description: Focused US beverage or brand query
        required: true
        default: Pepsi Zero Sugar
        type: string
      page_size:
        description: Maximum FDC search hits to review (1-50)
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CLEARSIP_DATABASE_URL }}
      FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Check protected refresh credentials
        run: |
          test -n "$DATABASE_URL"
          test -n "$FDC_API_KEY"
      - name: Apply immutable schema migrations
        run: python scripts/migrate_db.py
      - name: Import one reviewable FDC batch
        run: python scripts/import_fdc.py --query "${{ inputs.query }}" --page-size "${{ inputs.page_size }}"
