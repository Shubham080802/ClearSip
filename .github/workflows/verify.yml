name: Verify ClearSip

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:client
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python tests/api_smoke.py
      - run: python scripts/migrate_db.py --database-url "sqlite:///${{ runner.temp }}/clearsip-migration-test.db"
      - run: python scripts/migrate_db.py --database-url "sqlite:///${{ runner.temp }}/clearsip-migration-test.db"
